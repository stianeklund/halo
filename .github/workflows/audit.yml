name: Audit Gates

# The three binary-evidence audits that, until now, ran nowhere: they existed
# as tools and were invoked only by hand, so nothing caught a regression in
# them between one manual run and the next.
#
# Two of them (xcall-types, arg-counts) are fast and also gate at pre-commit;
# this job is their backstop, since --no-verify bypasses the hook. The third
# (callee-reg-args) takes 6m33s measured (run 30435934282), which is too slow
# for a commit hook and for a per-push run, so the schedule and PRs are its
# only homes.
#
# All three need the pristine XBE, which GitHub-hosted runners do not have --
# hence self-hosted. Each has a committed baseline of pre-existing findings;
# only NEW findings, or ones whose evidence CHANGED, fail the job.

on:
  schedule:
    # 03:00 UTC -- clear of the equivalence nightly (00:00) and its chained
    # progress-report run, so a slow batch cannot delay this.
    - cron: '0 3 * * *'
  workflow_dispatch:
  # Push to main runs the FAST subset (see the `if:` on the callee register-arg
  # step). Without this, these gates fired only nightly and on PRs -- and since
  # work lands by direct push to main, a change to the equivalence harness could
  # sit untested for up to 24h while main.yml's green check said nothing about
  # it. Measured on run 30435934282: the whole job is 6m47s, of which the
  # callee register-arg sweep alone is 6m33s (96.6%). The other six gates total
  # ~13s, so running them per-push costs almost nothing on the shared box.
  push:
    branches: [main]
    paths:
      - 'kb.json'
      # patch.py resolves ported declarations against build/halo exports.
      # Source-only renames and unregistered TUs must run this patched-XBE gate.
      - 'src/**'
      - 'CMakeLists.txt'
      - 'tools/build/**'
      - 'tools/audit/**'
      - 'tools/equivalence/**'
      # Tool self-tests.
      - 'tools/bytematch/**'
      - 'tools/integrate/**'
      - 'tools/lift/**'
      - 'tools/memory/**'
      - 'tools/recovery/**'
      - 'tools/report/**'
      - 'tools/retrieval/**'
      - 'tools/verify/**'
      - 'tools/xbox/**'
      # A change to this workflow should run this workflow -- otherwise an edit
      # to the gating logic lands unverified.
      - '.github/workflows/audit.yml'
  pull_request:
    paths:
      - 'kb.json'
      - 'src/**'
      - 'CMakeLists.txt'
      - 'tools/build/**'
      - 'tools/audit/**'
      # The equivalence harness self-tests run here rather than in
      # equivalence.yml because several of them (test_xbe_symbol_addrs) read
      # the pristine XBE, which only this workflow links.
      - 'tools/equivalence/**'
      - 'tools/bytematch/**'
      - 'tools/integrate/**'
      - 'tools/lift/**'
      - 'tools/memory/**'
      - 'tools/recovery/**'
      - 'tools/report/**'
      - 'tools/retrieval/**'
      - 'tools/verify/**'
      - 'tools/xbox/**'
      - '.github/workflows/audit.yml'

env:
  XBE_DIR: ${{ vars.HALO_HOST_TREE || '/mnt/g/dev/halo' }}/halo-patched
  DELINKED_DIR: ${{ vars.HALO_HOST_TREE || '/mnt/g/dev/halo' }}/delinked
  # The other audits need only capstone, which system python3 has. The
  # equivalence self-tests also want z3/unicorn, which live in the venv --
  # without it two suites SKIP instead of running.
  VENV_PYTHON: ${{ vars.HALO_HOST_TREE || '/mnt/g/dev/halo' }}/.venv/bin/python3

jobs:
  audit:
    name: Binary-evidence audits
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Stage local assets
        uses: ./.github/actions/stage-local-assets
        with:
          xbe: "true"
          delinked: "true"
          required: >-
            halo-patched/cachebeta.xbe
            delinked/game_state.obj

      - name: Verify prerequisites
        run: |
          python3 -c "import capstone; print('capstone ok')"
          fail=0
          check() { if [ ! "$1" "$2" ]; then echo "::error::missing prerequisite: $2"; fail=1; else echo "ok: $2"; fi; }
          check -f halo-patched/cachebeta.xbe
          check -f delinked/game_state.obj
          exit "$fail"

      - name: Build PR candidate
        run: |
          cmake -Bbuild -S. -DCMAKE_TOOLCHAIN_FILE=toolchains/llvm.cmake
          # No --target: the equivalence self-tests (test_inflate_roundtrip.py)
          # need halo-patched/default.xbe regenerated, which only the separate
          # `patched_xbe` CMake target (depends on `halo`) produces. Building
          # just `--target halo` refreshes build/halo without it, leaving
          # default.xbe stale and failing the staleness check below.
          ${{ env.VENV_PYTHON }} tools/build/build.py -q
        timeout-minutes: 20

      # State the mode in the summary. A green check that silently covered a
      # subset is worse than a red one: it reads as "audited" to anyone who does
      # not know which trigger fired.
      - name: Note audit mode
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            printf '## Audit mode: FAST (push)\n\nAll gates except the callee register-arg sweep (6m33s), which runs on the nightly schedule and on PRs.\n' >> "$GITHUB_STEP_SUMMARY"
          else
            printf '## Audit mode: FULL (%s)\n\nAll gates including the callee register-arg sweep.\n' "${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Baseline-gate self-test
        run: python3 tools/audit/test_baseline_gates.py

      # The hazard-lint self-tests, which ran nowhere before: every check in
      # check_lift_hazards.py could be narrowed into silence with all gates
      # green.  The minimum-count guard exists because `unittest discover`
      # collects TestCase classes only -- a pytest-style file (bare test_
      # functions) contributes zero tests and still exits 0, which is the same
      # "green while running none of it" failure the equivalence step below
      # was written to avoid.
      - name: Hazard-lint self-tests
        if: always()
        run: |
          set -e
          PY="${{ env.VENV_PYTHON }}"
          [ -x "$PY" ] || PY=python3
          OUTPUT=$("$PY" -m unittest discover -s tools/audit/tests -p 'test_*.py' -v 2>&1)
          echo "$OUTPUT"
          RAN=$(echo "$OUTPUT" | sed -n 's/^Ran \([0-9]\+\) test.*/\1/p' | tail -1)
          if [ -z "$RAN" ] || [ "$RAN" -lt 6 ]; then
            echo "::error::expected at least 6 hazard-lint tests, discovery ran ${RAN:-0}"
            exit 1
          fi

      # Optional mnemonic score persistence. These are not raw byte accuracy.
      # Neither suite ran anywhere in CI before, which
      # is how the dashboard button ended up writing only the committed floor
      # while the report generator read only the honest snapshot -- a score you
      # could watch appear and then vanish at the next regeneration, with every
      # gate green throughout.
      - name: Byte gate and mnemonic-persistence self-tests
        if: always()
        run: |
          PY="${{ env.VENV_PYTHON }}"
          [ -x "$PY" ] || PY=python3
          "$PY" -m unittest discover -s tools/verify -p 'test_byte_regression.py' -v
          "$PY" -m unittest discover -s tools/verify -p 'test_score_improve.py' -v
          "$PY" -m unittest discover -s tools/verify -p 'test_vc71_regression.py' -v
          "$PY" -m unittest discover -s tools/report -p 'test_vc71_score_merge.py' -v

      # The equivalence harness's own self-tests, which until now ran nowhere:
      # they were invoked only by hand, so the soundness pins on the stub-arg
      # comparator (a wrong offset into the right global must still be
      # REPORTED, an unmapped slot must still be REPORTED) could be loosened
      # into something that excuses real bugs and nothing would notice.
      #
      # run_all_tests.py rather than `unittest discover`: half these suites are
      # plain `sys.exit(main())` scripts that discovery does not see at all --
      # including test_stub_arg_trace.py, so a discovery step would have gone
      # green while running none of it.
      - name: Equivalence harness self-tests
        if: always()
        run: |
          set +e
          PY="${{ env.VENV_PYTHON }}"
          [ -x "$PY" ] || PY=python3
          OUTPUT=$("$PY" tools/equivalence/run_all_tests.py 2>&1)
          RC=$?
          echo "$OUTPUT"
          TALLY=$(echo "$OUTPUT" | grep -E '^[0-9]+ passed,')
          if [ $RC -ne 0 ]; then
            printf '## ❌ Equivalence Harness Self-Tests\n\n```\n%s\n```\n' "$OUTPUT" >> "$GITHUB_STEP_SUMMARY"
          else
            # Surface skips: a suite that skipped itself for a missing optional
            # dep (z3) or an unlinked XBE is a silent coverage hole, not a pass.
            SKIPPED=$(echo "$OUTPUT" | grep -E '^  SKIP ')
            printf '## ✅ Equivalence Harness Self-Tests\n\n%s\n' "$TALLY" >> "$GITHUB_STEP_SUMMARY"
            if [ -n "$SKIPPED" ]; then
              printf '\nSkipped (missing optional dependency -- coverage hole):\n```\n%s\n```\n' "$SKIPPED" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          exit $RC

      # Tool self-tests that ran nowhere before. Listed explicitly: a glob
      # would pick up test_inventory.py (a 60s report writer) and
      # test_periodic_tables.py (needs a live XBDM).
      - name: Tool self-tests
        if: always()
        run: |
          set +e
          PY="${{ env.VENV_PYTHON }}"
          [ -x "$PY" ] || PY=python3
          OUTPUT=$("$PY" -m pytest -q -p no:cacheprovider \
            tools/audit/test_audit_object_provenance.py \
            tools/audit/test_check_ported_addr_compare.py \
            tools/audit/test_check_static_in_tu.py \
            tools/audit/test_detect_param_return.py \
            tools/audit/test_patch.py \
            tools/audit/test_recover_assert_sites.py \
            tools/audit/test_routing_stats.py \
            tools/bytematch/test_bytematch.py \
            tools/bytematch/test_param_returns.py \
            tools/bytematch/test_target_campaign_policy.py \
            tools/bytematch/test_target_classifier.py \
            tools/lift/test_auto_lift_opencode.py \
            tools/lift/test_llm_auto_lift_enrichment.py \
            tools/lift/test_research_bundle.py \
            tools/lift/test_research_reuse_workflow.py \
            tools/lift/test_route_attempt.py \
            tools/lift/test_shape_atlas.py \
            tools/memory/test_skill_router_hook.py \
            tools/recovery/test_assert_metadata_guard.py \
            tools/recovery/test_check_category_purity.py \
            tools/recovery/test_coff_candidate_guard.py \
            tools/recovery/test_evidence_table.py \
            tools/recovery/test_recovery_goal.py \
            tools/recovery/test_source_recovery.py \
            tools/recovery/test_structize.py \
            tools/recovery/test_structize_e2e.py \
            tools/report/test_behavior_count.py \
            tools/report/test_behavior_report.py \
            tools/report/test_dashboard_js_syntax.py \
            tools/report/test_progress_server_match.py \
            tools/report/test_raw_byte_audit_report.py \
            tools/retrieval/test_cohort_report.py \
            tools/retrieval/test_singleton_lock.py \
            tools/verify/test_compare_obj_disassembly.py \
            tools/verify/test_compiler_profile.py \
            tools/verify/test_decals_obj_remaining_thunks.py \
            tools/verify/test_frame_mismatch.py \
            tools/verify/test_function_bounds.py \
            tools/verify/test_persistent_storage_crc.py \
            tools/verify/test_ref_selection.py \
            tools/verify/test_run_dual_oracle_tests.py \
            tools/verify/test_vc71_low_score_census.py \
            tools/xbox/test_symbolize_exception.py \
            tools/xbox/test_verify_toggles_live.py 2>&1)
          RC=$?
          set -e
          echo "$OUTPUT"
          [ $RC -eq 0 ] || exit $RC
          PASSED=$(echo "$OUTPUT" | sed -n 's/^\([0-9]\+\) passed.*/\1/p' | tail -1)
          if [ -z "$PASSED" ] || [ "$PASSED" -lt 500 ]; then
            echo "::error::expected at least 500 tool self-tests to pass, got ${PASSED:-0}"
            exit 1
          fi
          # Script-style suites that pytest collects nothing from.
          "$PY" tools/integrate/test_auto_reintegrate_absorb.py
          "$PY" tools/integrate/test_auto_reintegrate_derived.py
          "$PY" tools/verify/test_match_attribution.py

      - name: XCALL type audit
        run: |
          set +e
          OUTPUT=$(python3 tools/audit/check_xcall_types.py --all 2>&1)
          RC=$?
          echo "$OUTPUT"
          if [ $RC -ne 0 ]; then
            printf '## ❌ XCALL Type Mismatch (%d ERROR)\n\n```\n%s\n```\n' "$RC" "$OUTPUT" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '## ✅ XCALL Type Audit\n\nNo ERROR-level float↔int mismatches.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $RC

      - name: Arg-count audit (kb.json decls vs call-site ADD ESP)
        if: always()
        run: |
          set +e
          OUTPUT=$(python3 tools/audit/check_arg_counts.py --check --no-report 2>&1)
          RC=$?
          echo "$OUTPUT"
          if [ $RC -ne 0 ]; then
            printf '## ❌ New Arg-Count Mismatch\n\n```\n%s\n```\n' "$(echo "$OUTPUT" | sed -n '/--check FAILED/,$p')" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '## ✅ Arg-Count Audit\n\n%s\n' "$(echo "$OUTPUT" | grep -- '--check OK')" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $RC

      # Whole-repo by design (~2s): the pre-commit hook only scans staged .c
      # files, so a bug introduced in a commit that staged nothing else stays
      # invisible until this sweep sees it.
      - name: Constant-for-register-arg audit
        if: always()
        run: |
          set +e
          OUTPUT=$(python3 tools/audit/check_const_reg_args.py --check --no-report 2>&1)
          RC=$?
          echo "$OUTPUT"
          if [ $RC -ne 0 ]; then
            printf '## ❌ New Constant-For-Register-Arg Finding\n\n```\n%s\n```\n' "$(echo "$OUTPUT" | sed -n '/ERROR:/,$p')" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '## ✅ Constant-For-Register-Arg Audit\n\n%s\n' "$(echo "$OUTPUT" | grep -- '--check OK')" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $RC

      # The one slow gate: 6m33s of the job's 6m47s. Skipped on push so the
      # per-push run costs ~13s; the nightly schedule and PRs still run it in
      # full. Do NOT add a fast/partial mode here instead -- the sweep is slow
      # because it disassembles every unported callee, and a sampled version
      # would report "OK" from having looked at a subset, which is the exact
      # failure this workflow exists to prevent.
      - name: Callee register-arg audit
        if: ${{ always() && github.event_name != 'push' }}
        run: |
          set +e
          OUTPUT=$(python3 tools/audit/check_callee_reg_args.py --check 2>&1)
          RC=$?
          echo "$OUTPUT"
          if [ $RC -ne 0 ]; then
            printf '## ❌ New Missing @<reg> Callee\n\n```\n%s\n```\n' "$(echo "$OUTPUT" | sed -n '/--check FAILED/,$p')" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '## ✅ Callee Register-Arg Audit\n\n%s\n' "$(echo "$OUTPUT" | grep -- '--check OK')" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $RC

      # Moved here from runtime-oracle.yml. Both are static capstone sweeps of
      # the pristine XBE with nothing to do with the Xbox, but they lived in a
      # workflow that DEPLOYS to the shared dev box -- so whenever that
      # hardware batch broke, these two went red with it and their result
      # became unreadable. They belong with the other binary-evidence audits.
      - name: Assert-target detector (system_exit vs halt_and_catch_fire)
        if: always()
        run: |
          set +e
          OUTPUT=$(python3 tools/audit/check_assert_targets.py --check 2>&1)
          RC=$?
          echo "$OUTPUT" | tail -30
          if [ $RC -ne 0 ]; then
            printf '## ❌ Assert-target swaps detected\n\n```\n%s\n```\n' "$(echo "$OUTPUT" | grep ERROR | head -20)" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '## ✅ Assert-target detector\n\nNo system_exit/halt_and_catch_fire swaps in ported functions.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $RC

      - name: Stdcall-decl mismatch detector (kb.json decl vs binary RET)
        if: always()
        run: |
          set +e
          OUTPUT=$(python3 tools/audit/check_stdcall_ret.py --check 2>&1)
          RC=$?
          echo "$OUTPUT" | tail -30
          if [ $RC -ne 0 ]; then
            NEW=$(echo "$OUTPUT" | grep -E "^ERROR" | grep -v "\[baselined\]" | head -20)
            printf '## ❌ New stdcall-decl mismatches\n\n```\n%s\n```\n' "$NEW" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '## ✅ Stdcall-decl detector\n\nNo non-baselined decl-vs-RET mismatches.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $RC
