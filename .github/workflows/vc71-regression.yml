name: VC71 Mnemonic-Match Regression

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'src/**'
      - 'kb.json'
      - 'toolchains/**'
      - 'tools/analysis/knowledge.py'
      - 'tools/verify/compare_obj.py'
      - 'tools/verify/vc71_cache.py'
      - 'tools/verify/function_bounds.json'
      - 'tools/verify/vc71_regression.py'
      - 'tools/verify/vc71_verify.py'
      - 'tools/verify/xbe_reference.py'
      - 'tools/verify/vc71_scores.json'
      - '.github/workflows/vc71-regression.yml'

permissions:
  contents: read

concurrency:
  group: vc71-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  vc71-regression:
    name: VC71 mnemonic-match regression
    runs-on: self-hosted
    timeout-minutes: 45
    env:
      VENV_PYTHON: /mnt/g/dev/halo/.venv/bin/python3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stage pristine XBE
        uses: ./.github/actions/stage-local-assets
        with:
          xbe: "true"
          required: halo-patched/cachebeta.xbe

      - name: Check VC71 score floors
        shell: bash
        run: |
          set -o pipefail
          PY="$VENV_PYTHON"
          [ -x "$PY" ] || PY=python3
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            BASE='${{ github.event.pull_request.base.sha }}'
            HEAD='${{ github.event.pull_request.head.sha }}'

            # The floor in a PR is untrusted input: compare its existing entries
            # to the base before using the base file for measurement below. This
            # permits new/improved entries but prevents a lowered or deleted
            # floor from weakening this or a later PR's gate.
            BASE_SCORES="$RUNNER_TEMP/vc71_scores.base.json"
            git show "$BASE:tools/verify/vc71_scores.json" > "$BASE_SCORES"
            "$PY" - "$BASE_SCORES" tools/verify/vc71_scores.json <<'PY'
          import json
          import os
          import sys

          with open(sys.argv[1], encoding="utf-8") as f:
              base_doc = json.load(f)
              base = base_doc.get("scores", {})
          with open(sys.argv[2], encoding="utf-8") as f:
              candidate_doc = json.load(f)
              candidate = candidate_doc.get("scores", {})

          # Prune stale base entries referencing missing source files so they do not
          # fail candidate removal checks or get re-copied below.
          base_pruned = {}
          for name, entry in base.items():
              src = entry.get("source", "")
              if src and not os.path.isfile(src):
                  continue
              base_pruned[name] = entry

          # Keyed by ADDRESS, not by name: a function keeps its floor across a
          # pure rename (same address, old name -> new name, same-or-better
          # score), so a name-only diff must not read that as a removal. Only
          # an address that is missing from the candidate, or whose score
          # dropped at the same address, is a real regression. Entries with no
          # "addr" fall back to name-keying (never expected on a clean floor,
          # but keeps them checked instead of silently skipped).
          def by_addr(scores):
              out = {}
              for name, entry in scores.items():
                  key = entry.get("addr") or f"name:{name}"
                  out.setdefault(key, (name, entry))
              return out

          base_by_addr = by_addr(base_pruned)
          candidate_by_addr = by_addr(candidate)

          errors = []
          for key, (name, before) in base_by_addr.items():
              found = candidate_by_addr.get(key)
              if found is None:
                  errors.append(f"{name}: removed (was {before.get('score')})")
                  continue
              after_name, after = found
              label = after_name if after_name == name else f"{name} -> {after_name}"
              try:
                  if float(after["score"]) < float(before["score"]):
                      errors.append(f"{label}: {before['score']} -> {after['score']}")
              except (KeyError, TypeError, ValueError):
                  errors.append(f"{label}: invalid score entry")

          if errors:
              print("VC71 score floors must not be lowered or removed:", file=sys.stderr)
              print("\n".join(f"  - {error}" for error in errors[:50]), file=sys.stderr)
              if len(errors) > 50:
                  print(f"  ... and {len(errors) - 50} more", file=sys.stderr)
              sys.exit(1)

          base_doc["scores"] = base_pruned
          with open(sys.argv[1], "w", encoding="utf-8") as f:
              json.dump(base_doc, f, indent=2)
          PY
            cp "$BASE_SCORES" tools/verify/vc71_scores.json
            mapfile -t CHANGED < <(git diff --name-only "$BASE...$HEAD")
            FULL_CHECK=0
          else
            # A manual run is the bootstrap/diagnostic path: exercise every
            # existing floor on the selected revision.
            CHANGED=()
            FULL_CHECK=1
          fi
          mapfile -t CHANGED_SOURCES < <(printf '%s\n' "${CHANGED[@]}" | grep -E '^src/.*\.c$' || true)
          # A new source file can have no VC71 floor yet. `check` handles
          # that case and validates every existing baselined function it can
          # measure; the lift pipeline/commit hook establishes new floors.
          SOURCES=("${CHANGED_SOURCES[@]}")

          KB_CHANGED=0
          for path in "${CHANGED[@]}"; do
            case "$path" in
              # A non-C source file can alter any TU. C files retain the fast,
              # source-scoped path above; headers, CMake, generated declarations,
              # compiler settings, and score/reference code must check all floors.
              src/*.c)
                ;;
              # kb.json is per-function, not cross-cutting: a rename, ported-flag,
              # or decl edit only affects the source file(s) that own the changed
              # address(es). Resolving that narrows the common case (every
              # lift/rename touches kb.json) from a full 185+ file sweep to just
              # the handful of files actually affected, instead of forcing
              # FULL_CHECK on every PR that touches it.
              kb.json)
                KB_CHANGED=1
                ;;
              src/*|CMakeLists.txt|toolchains/*|tools/analysis/knowledge.py|tools/verify/compare_obj.py|tools/verify/vc71_cache.py|tools/verify/function_bounds.json|tools/verify/vc71_regression.py|tools/verify/vc71_verify.py|tools/verify/xbe_reference.py|tools/verify/vc71_scores.json)
                FULL_CHECK=1
                ;;
            esac
          done

          if [ "$FULL_CHECK" -ne 1 ] && [ "$KB_CHANGED" -eq 1 ]; then
            mapfile -t KB_SOURCES < <("$PY" tools/audit/kb_diff_sources.py --base "$BASE" --head "$HEAD")
            SOURCES+=("${KB_SOURCES[@]}")
          fi
          if [ "${#SOURCES[@]}" -gt 0 ]; then
            mapfile -t SOURCES < <(printf '%s\n' "${SOURCES[@]}" | sort -u)
          fi

          if [ "$FULL_CHECK" -eq 1 ]; then
            ARGS=(check --strict)
            SCOPE='all baselined translation units (shared code, declarations, or reference tooling changed)'
          elif [ "${#SOURCES[@]}" -gt 0 ]; then
            ARGS=(check --strict --source "${SOURCES[@]}")
            SCOPE="${#SOURCES[@]} changed C source file(s)"
          else
            echo 'No source or score-authority changes found; nothing to measure.'
            exit 0
          fi

          echo "VC71 scope: $SCOPE"
          set +e
          OUTPUT=$("$PY" tools/verify/vc71_regression.py "${ARGS[@]}" 2>&1)
          RC=$?
          set -e
          echo "$OUTPUT"
          if [ "$RC" -ne 0 ]; then
            printf '## ❌ VC71 Mnemonic-Match Regression\n\nScope: %s\n\n```\n%s\n```\n' "$SCOPE" "$OUTPUT" >> "$GITHUB_STEP_SUMMARY"
          else
            SUMMARY=$(printf '%s\n' "$OUTPUT" | grep '^OK — no regressions' | tail -1)
            printf '## ✅ VC71 Mnemonic-Match Regression\n\nScope: %s\n\n%s\n' "$SCOPE" "${SUMMARY:-VC71 score floors passed.}" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$RC"
