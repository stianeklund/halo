name: Runtime Oracle Tests

on:
  # NOTE: no `push:` trigger by design. This workflow DEPLOYS to the shared
  # dev Xbox and would poison its state on every push to main (a real incident:
  # "rogue runner deploys harness builds"). Run it only on the nightly schedule
  # or via explicit manual dispatch.
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Optional target limit (0 = all)'
        required: false
        default: '0'
      skip_build:
        description: 'Reuse existing built XBE when possible'
        required: false
        default: false
        type: boolean

env:
  VENV_PYTHON: /mnt/g/dev/halo/.venv/bin/python3

jobs:
  runtime-oracle:
    name: Nightly runtime oracle
    runs-on: self-hosted
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Link host assets
        run: |
          ln -sfn /mnt/g/dev/halo/halo-patched "$GITHUB_WORKSPACE/halo-patched"

      - name: Verify prerequisites
        run: |
          ${{ env.VENV_PYTHON }} -c "print('ok')"
          which cmake

      # The assert-target and stdcall-decl detectors used to run here. They are
      # static XBE sweeps that never touch the Xbox, so they now live in
      # audit.yml (03:00, hardware-free) — a broken hardware batch no longer
      # takes them red with it.

      - name: Run runtime-oracle batch
        continue-on-error: true
        run: |
          LIMIT="${{ github.event.inputs.limit || '0' }}"
          EXTRA_FLAGS=""
          if [ "${{ github.event.inputs.skip_build || 'false' }}" = "true" ]; then
            EXTRA_FLAGS="$EXTRA_FLAGS --skip-build"
          fi
          set +e
          ${{ env.VENV_PYTHON }} tools/verify/runtime_oracle_batch.py \
            --limit "$LIMIT" \
            --csv \
            $EXTRA_FLAGS
          RC=$?
          echo "RUNTIME_ORACLE_RC=$RC" >> "$GITHUB_ENV"
          exit 0

      - name: Generate progress dashboard artifact
        if: always()
        run: |
          mkdir -p artifacts/progress
          ${{ env.VENV_PYTHON }} tools/report/generate_decomp_report.py \
            --output artifacts/progress/report.json \
            --html artifacts/progress/index.html

      - name: Update historical data
        if: always()
        run: |
          ${{ env.VENV_PYTHON }} tools/report/history.py \
            --add-snapshot artifacts/progress/report.json

      - name: Upload runtime-oracle artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-oracle-${{ github.run_number }}
          path: |
            artifacts/runtime_oracle/
            artifacts/runtime_oracle_batch/
            artifacts/progress/
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          LATEST=$(ls -1dt artifacts/runtime_oracle_batch/* 2>/dev/null | head -n 1)
          if [ -n "$LATEST" ] && [ -f "$LATEST/summary.json" ]; then
            LATEST_SUMMARY="$LATEST/summary.json" ${{ env.VENV_PYTHON }} tools/report/runtime_oracle_summary.py >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail on runtime-oracle regressions
        if: always()
        run: |
          # Say WHICH check failed. The old form was three bare `test` lines,
          # so a red run reported only "step failed" and you had to guess
          # whether the cause was a lift regression or the dev Xbox being
          # offline -- the two need completely different responses.
          RC="${RUNTIME_ORACLE_RC:-1}"
          if [ "$RC" = "0" ]; then
            echo "runtime-oracle batch: OK"
            exit 0
          fi
          if [ "${RUNTIME_ORACLE_RC:-}" = "" ]; then
            echo "runtime-oracle batch did not report an exit code — the step"
            echo "died before finishing (build failure, or the box was gone)."
          else
            echo "runtime-oracle batch exited $RC."
          fi
          echo ""
          echo "Check the batch summary above for per-target status. A"
          echo "'timeout waiting for candidate harness output' on EVERY target"
          echo "means the harness never ran (dev Xbox offline / not deployed),"
          echo "not that the lifts regressed."
          printf '## ❌ Runtime oracle batch failed (rc=%s)\n' "$RC" >> "$GITHUB_STEP_SUMMARY"
          exit 1
