name: Progress Report

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
  # Chain off the nightly Equivalence Tests run instead of a fixed clock: this
  # report reads the fresh artifacts/batch_verify/summary.json that Equivalence
  # produces, so it must run *after* Equivalence finishes. workflow_run fires on
  # Equivalence completion (any conclusion) so the dashboard updates even when
  # equivalence is red.
  workflow_run:
    workflows: ["Equivalence Tests"]
    types:
      - completed

jobs:
  generate-progress-report:
    name: Generate decomp.dev-style Progress Report
    # Push and manual dispatch always run. The workflow_run path is gated to the
    # *scheduled* Equivalence run so ordinary pushes — which also trigger
    # Equivalence Tests — don't double-fire this report.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.event == 'schedule'
    runs-on: self-hosted
    permissions:
      contents: write
      actions: read
    env:
      VENV_PYTHON: ${{ vars.HALO_HOST_TREE || '/mnt/g/dev/halo' }}/.venv/bin/python3
      BUILD_DIR: ${{ vars.HALO_HOST_TREE || '/mnt/g/dev/halo' }}/build
      ARTIFACTS_DIR: ${{ vars.HALO_HOST_TREE || '/mnt/g/dev/halo' }}/artifacts
      DELINKED_DIR: ${{ vars.HALO_HOST_TREE || '/mnt/g/dev/halo' }}/delinked
      XBE_DIR: ${{ vars.HALO_HOST_TREE || '/mnt/g/dev/halo' }}/halo-patched
    
    steps:
      - name: Clone Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download nightly measured coverage
        if: github.event_name == 'workflow_run'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: measured-leaf-cache
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/measured-leaf-cache

      - name: Use nightly measured coverage
        if: github.event_name == 'workflow_run'
        run: |
          CACHE="${{ runner.temp }}/measured-leaf-cache/leaf_cache.json"
          if [ -s "$CACHE" ]; then
            cp "$CACHE" tools/equivalence/leaf_cache.json
          fi

      # NOTE: scoring no longer needs delinked/.  VC71 references are derived
      # from the pristine XBE + the committed tools/verify/function_bounds.json
      # (tools/verify/xbe_reference.py), so populate scores with or without it.
      # It is still staged because the equivalence/objdiff artifacts the report
      # surfaces are produced against those objects.  Safe to drop once nothing
      # in this job reads delinked/.
      - name: Stage Report Assets
        uses: ./.github/actions/stage-local-assets
        with:
          xbe: "true"
          delinked: "true"
          required: halo-patched/cachebeta.xbe

      # Byte compilation and publication use workspace-owned directories.
      # Historical behavioral evidence stays read-only on the host.
      - name: Link Bulk Report Data
        run: |
          mkdir -p artifacts
          for dir in equivalence runtime_oracle runtime_oracle_batch; do
            if [ ! -e "artifacts/$dir" ] && [ -d "$ARTIFACTS_DIR/$dir" ]; then
              ln -s "$ARTIFACTS_DIR/$dir" "artifacts/$dir"
            fi
          done

      - name: Link Safety
        run: bash tools/ci/check_workspace_links.sh

      - name: Refresh fresh raw-XBE byte accuracy
        run: |
          mkdir -p artifacts/byte_measurement
          printf '{"sources":null}\n' > artifacts/byte_measurement/plan.json
          "$VENV_PYTHON" tools/verify/byte_regression.py measure \
            --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --plan artifacts/byte_measurement/plan.json \
            --output artifacts/byte_measurement/snapshot.json --publish --workers 4

      - name: Validate fresh byte snapshot
        run: |
          jq -e --arg sha "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" '
            (.commit == $sha) and (.run_id == $run) and (.dirty == false) and
            (.metric == "raw_xbe_aligned_byte_lower_bound") and ((.records | length) > 0)
          ' artifacts/byte_measurement/snapshot.json

      - name: Generate CI Status
        run: |
          mkdir -p artifacts/progress
          "$VENV_PYTHON" tools/report/generate_ci_status.py \
            --output-dir artifacts/progress

      - name: Generate Progress Report
        env:
          HALO_REPORT_BATCH_VERIFY_DIR: ${{ vars.HALO_HOST_TREE || '/mnt/g/dev/halo' }}/artifacts/batch_verify
        run: |
          "$VENV_PYTHON" tools/report/generate_decomp_report.py \
            --output artifacts/progress/report.json \
            --html artifacts/progress/index.html

      - name: Validate Report Provenance
        run: |
          jq --arg sha "$GITHUB_SHA" '
            .provenance.inputs as $inputs |
            {
              report_commit: .meta.commit_sha,
              raw_xbe_md5: $inputs.raw_xbe.md5,
              function_bounds_md5: $inputs.function_bounds.recorded_xbe_md5,
              snapshot_exists: $inputs.raw_byte_snapshot.exists,
              snapshot_score_count: $inputs.raw_byte_snapshot.function_count,
              snapshot_commit: $inputs.raw_byte_snapshot.commit,
              snapshot_dirty: $inputs.raw_byte_snapshot.dirty,
              expected_commit: $sha,
              valid: ((.meta.commit_sha == $sha) and
                      ($inputs.raw_xbe.md5 != null) and
                      ($inputs.function_bounds.recorded_xbe_md5 != null) and
                      ($inputs.raw_xbe.md5 == $inputs.function_bounds.recorded_xbe_md5) and
                      ($inputs.raw_byte_snapshot.commit == $sha) and
                      ($inputs.raw_byte_snapshot.dirty == false))
            }
          ' artifacts/progress/report.json
          jq -e --arg sha "$GITHUB_SHA" '
            .provenance.inputs as $inputs |
            (.meta.commit_sha == $sha) and
            ($inputs.raw_xbe.md5 != null) and
            ($inputs.function_bounds.recorded_xbe_md5 != null) and
            ($inputs.raw_xbe.md5 == $inputs.function_bounds.recorded_xbe_md5) and
            ($inputs.raw_byte_snapshot.commit == $sha) and
            ($inputs.raw_byte_snapshot.dirty == false)
          ' artifacts/progress/report.json
      
      - name: Validate Report Byte Totals
        run: |
          # Unit byte totals cannot exceed the XBE; inflated sizes (e.g. a missing
          # size source falling back to cross-unit address gaps) shrink the treemap.
          XBE_SIZE=$(stat -c%s halo-patched/cachebeta.xbe)
          jq -e --argjson max "$XBE_SIZE" '.summary.bytes.total <= $max' artifacts/progress/report.json \
            || { echo "::error::summary.bytes.total exceeds XBE size ($XBE_SIZE)"; exit 1; }

      - name: Update README Badge Data
        run: |
          PERCENT=$("$VENV_PYTHON" -c "import json; d=json.load(open('artifacts/progress/report.json')); print('%.1f' % d['summary']['functions']['percent'])")
          echo "PROGRESS_PERCENT=$PERCENT" >> $GITHUB_ENV
          printf '{"schemaVersion":1,"label":"progress","message":"%s%%","color":"blue"}\n' "$PERCENT" > artifacts/progress/badge.json
      
      - name: Download Existing History
        run: |
          # Try to fetch existing history from gh-pages
          git fetch origin gh-pages:gh-pages --depth=1 || true
          if git rev-parse --verify -q refs/heads/gh-pages >/dev/null; then
            git show gh-pages:progress/history.json > artifacts/progress/history.json 2>/dev/null || echo "No existing history found"
            git show gh-pages:report.json > "$RUNNER_TEMP/previous-report.json" 2>/dev/null || true
          fi
        continue-on-error: true

      - name: Check behavioral-match count
        run: |
          "$VENV_PYTHON" tools/report/check_behavior_count.py \
            "$RUNNER_TEMP/previous-report.json" artifacts/progress/report.json
      
      - name: Update Historical Data
        run: |
          "$VENV_PYTHON" tools/report/history.py \
            --add-snapshot artifacts/progress/report.json \
            --commit ${{ github.sha }}
       
      - name: Generate Historical Summary
        run: |
          "$VENV_PYTHON" tools/report/history.py --show-summary
          "$VENV_PYTHON" tools/report/history.py --show-velocity
          "$VENV_PYTHON" tools/report/history.py --show-eta
      
      - name: Copy History for Deployment
        run: |
          # Ensure history is in the deploy directory
          cp artifacts/progress/history.json artifacts/progress/history.json.deploy 2>/dev/null || true
      
      - name: Prepare GitHub Pages Payload
        run: |
          mkdir -p artifacts/pages/progress
          cp -a artifacts/progress/. artifacts/pages/
          cp -a artifacts/progress/. artifacts/pages/progress/

      - name: Upload GitHub Pages Payload
        uses: actions/upload-artifact@v4
        with:
          name: progress-report-pages-${{ github.sha }}
          path: artifacts/pages
          if-no-files-found: error

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./artifacts/pages
          publish_branch: gh-pages
          keep_files: true
      
      - name: Comment on PR (if applicable)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('artifacts/progress/report.json', 'utf8'));
            
            // Try to load historical data for velocity
            let velocityInfo = '';
            try {
              const history = JSON.parse(fs.readFileSync('artifacts/progress/history.json', 'utf8'));
              if (history.snapshots && history.snapshots.length >= 2) {
                const recent = history.snapshots.slice(-7);
                const funcsGained = recent[recent.length-1].summary.functions.ported - recent[0].summary.functions.ported;
                const days = Math.max(1, recent.length);
                const velocity = (funcsGained / days).toFixed(2);
                velocityInfo = `\n📈 **Velocity:** ${velocity} funcs/day (7-day avg)`;
              }
            } catch (e) {
              // No historical data yet
            }
            
            const body = `## 📊 Decompilation Progress Report
            
            **Overall Progress:** ${report.summary.functions.percent.toFixed(2)}%
            - Functions: ${report.summary.functions.ported.toLocaleString()} / ${report.summary.functions.total.toLocaleString()}
            - Bytes: ${report.summary.bytes.percent.toFixed(2)}%
            
            **Translation Units:** ${report.units.length}${velocityInfo}
            
            [View Full Dashboard](https://stianeklund.github.io/halo/)
            
            <sub>Generated at ${report.meta.timestamp}</sub>
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  compare-progress:
    name: Compare Progress with Previous
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Clone Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Generate Base Report
        run: |
          git checkout ${{ github.event.pull_request.base.sha }}
          python3 tools/report/generate_decomp_report.py \
            --output /tmp/base_report.json 2>/dev/null || echo '{"summary": {"functions": {"ported": 0, "total": 1}}}' > /tmp/base_report.json
      
      - name: Generate PR Report
        run: |
          git checkout ${{ github.event.pull_request.head.sha }}
          python3 tools/report/generate_decomp_report.py \
            --output /tmp/pr_report.json
      
      - name: Compare Reports
        run: |
          python3 << 'EOF'
          import json, os

          with open('/tmp/base_report.json') as f:
              base = json.load(f)
          with open('/tmp/pr_report.json') as f:
              pr = json.load(f)
          
          base_funcs = base['summary']['functions']['ported']
          pr_funcs = pr['summary']['functions']['ported']
          delta = pr_funcs - base_funcs
          
          base_bytes = base['summary']['bytes']['ported']
          pr_bytes = pr['summary']['bytes']['ported']
          bytes_delta = pr_bytes - base_bytes
          
          print(f"::notice title=Progress Change::Functions: {'+' if delta >= 0 else ''}{delta} | Bytes: {'+' if bytes_delta >= 0 else ''}{bytes_delta:,}")
          
          # Write summary for GitHub Actions
          with open(os.environ.get('GITHUB_STEP_SUMMARY', '/dev/null'), 'a') as f:
              f.write(f"## 📈 Progress Change\n\n")
              f.write(f"| Metric | Base | PR | Delta |\n")
              f.write(f"|--------|------|-----|-------|\n")
              f.write(f"| Functions | {base_funcs:,} | {pr_funcs:,} | {'+' if delta >= 0 else ''}{delta} |\n")
              f.write(f"| Bytes | {base_bytes:,} | {pr_bytes:,} | {'+' if bytes_delta >= 0 else ''}{bytes_delta:,} |\n")
          EOF
